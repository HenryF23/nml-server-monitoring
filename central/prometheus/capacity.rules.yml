groups:
  - name: nml-capacity
    interval: 15s
    rules:
      - record: nml:server_cpu_usage_percent
        expr: 100 - avg by (server) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100

      # Hottest CPU sensor reported by the standard Linux hwmon drivers.
      # Servers without a supported sensor simply have no value.
      - record: nml:server_cpu_temperature_celsius
        expr: max by (server) (node_hwmon_temp_celsius{job="node-exporter"} * on (server, chip) group_left() node_hwmon_chip_names{job="node-exporter",chip_name=~"coretemp|k10temp|zenpower|cpu_thermal"})

      - record: nml:gpu_utilization_percent
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[5m])

      - record: nml:gpu_vram_usage_percent
        expr: 100 * avg_over_time(DCGM_FI_DEV_FB_USED[5m]) / (avg_over_time(DCGM_FI_DEV_FB_USED[5m]) + avg_over_time(DCGM_FI_DEV_FB_FREE[5m]))

      - record: nml:server_gpu_count
        expr: count by (server) (DCGM_FI_DEV_GPU_UTIL)

      - record: nml:server_free_gpu_count
        expr: count by (server) ((nml:gpu_utilization_percent < 10) and on (server, gpu) (nml:gpu_vram_usage_percent < 10)) or on (server) (0 * nml:server_gpu_count)

      - record: nml:server_available
        expr: (nml:server_free_gpu_count == bool nml:server_gpu_count) * on (server) (nml:server_cpu_usage_percent < bool 25) * on (server) (nml:server_gpu_count > bool 0)

      # Capacity-first state used by Grafana. Descending numeric order is the
      # intended scheduling order: 6=available, 5=has capacity, 4=CPU busy,
      # 3=in use. CPU-only (2), missing GPU metrics (1), and offline (0) are
      # added by the dashboards because they do not have live GPU rule series.
      - record: nml:server_status
        expr: 3 + (nml:server_free_gpu_count > bool 0) + (nml:server_free_gpu_count > bool 0) * on (server) (nml:server_cpu_usage_percent < bool 25) + (nml:server_free_gpu_count == bool nml:server_gpu_count) * on (server) (nml:server_cpu_usage_percent < bool 25)
