name: monitoring-node

services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:${NODE_EXPORTER_VERSION:-v1.12.1}
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION:-v0.60.5}
    restart: unless-stopped
    network_mode: host
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --listen_ip=127.0.0.1
      - --port=18080

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:${DCGM_EXPORTER_TAG:-latest}
    restart: unless-stopped
    profiles:
      - gpu
    network_mode: host
    cap_add:
      - SYS_ADMIN
    gpus: all
    environment:
      DCGM_EXPORTER_LISTEN: 127.0.0.1:9400

  # All collectors share the host network but listen only on loopback. The
  # agent is the only component that talks to another server, over Tailscale.
  prometheus-agent:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.13.2}
    restart: unless-stopped
    user: "65534:65534"
    network_mode: host
    depends_on:
      - node-exporter
      - cadvisor
    command:
      - --agent
      - --config.file=/etc/prometheus/agent.yml
      - --storage.agent.path=/prometheus
      - --web.listen-address=127.0.0.1:9095
    environment:
      SERVER_NAME: ${SERVER_NAME:?Run setup-node.sh first}
      TAILSCALE_IP: ${TAILSCALE_IP:?Run setup-node.sh first}
    volumes:
      - ./prometheus/agent.yml:/etc/prometheus/agent.yml:ro
      - prometheus_agent_data:/prometheus

volumes:
  prometheus_agent_data:
